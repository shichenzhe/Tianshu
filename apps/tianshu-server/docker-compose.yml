# apps/tianshu-server/docker-compose.yml
# 检索模式部署：server + PG 检索库（pgvector 官方镜像，含 FTS 所需全部能力）
# 默认（SQLite 本地检索）部署不需要本文件——单独 docker run server 即可。
services:
  search-pg:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: tianshu
      POSTGRES_PASSWORD: tianshu_search
      POSTGRES_DB: tianshu_search
    volumes:
      - search-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tianshu -d tianshu_search"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 宿主直连调试时放开：ports: ["5432:5432"]
  server:
    # 注意：本服务镜像构建暂不可用，待 Docker 治理批修复（本段保留为目标
    # 形态）——Dockerfile 为独立仓时代产物（COPY package*.json + npm ci 按
    # 单仓假定），monorepo 化后任何上下文都无法按现配方构建：server-only
    # 上下文够不着 @tianshu/* workspace 包，根上下文会整体安装/构建整个
    # monorepo 而非本服务。当下可用形态：宿主进程跑 server（build 后
    # node dist/src/main.js），SEARCH_DB_URL 指向本 compose 起的 search-pg
    # （宿主直连时放开上方 search-pg 的 ports 注释）。
    # compose 相对路径以本文件目录为基：monorepo 根 = ../..（非 ..=apps/）
    build:
      context: ../..
      dockerfile: apps/tianshu-server/Dockerfile
    environment:
      SEARCH_DB_URL: postgres://tianshu:tianshu_search@search-pg:5432/tianshu_search
    depends_on:
      search-pg:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  search-pg-data: {}
