# 发版流水线：tag（v*）触发——三平台打安装包，Artifacts + GitHub Releases 双通道
# （与 ci.yml 的 push main 质量门解耦；日常 push 不出制品，打 tag 才出包）
# 发布面单点化（2026-11-24 根治并发 attach 竞态）：构建 job 只 upload-artifact，
# 串行 publish 尾 job 单点建 Release + 写 body + 挂全部资产——此前 6 个 attach
# （3 桌面 matrix + android）并发创建同一 Release，v0.1.2 发版 windows job 在
# attach 步骤撞竞态标红（资产实传成功，但 run 结论失败且不可复现）
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # runner 无证书 + 禁用自动发现：electron-builder 直接跳过 codesign（并非
  # adhoc 重签——v0.1.1 实测 _CodeSignature 缺席、Identifier 仍是原始
  # Electron）。后果：mac 制品经浏览器下载带 quarantine，Gatekeeper 校验
  # 无签名报「已损坏」；win 制品触发 SmartScreen 蓝框。均非文件损坏，
  # 用户侧绕行见 RELEASE_NOTES.md 安装指引；根治需 Developer ID 证书 +
  # 公证（CSC_LINK/CSC_KEY_PASSWORD 等 secrets 配齐后移除本开关）
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build (renderer + main)
        run: npx vite build
        working-directory: apps/tianshu-desktop
      # postinstall 的 install-app-deps 已按 Electron ABI 编好原生模块（各平台
      # runner 工具链已实证可编），此处直接打包；--publish never = 只打不传，
      # generic publish url 为空由我们统一走 upload/Release
      - name: Package (electron-builder)
        run: npx electron-builder --publish never
        working-directory: apps/tianshu-desktop
      # latest*.yml（electron-updater 更新通道描述）必须随包进 artifact：
      # 发布面收敛到 publish 尾 job 后，Release 资产只能来自 artifact
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tianshu-${{ runner.os }}
          path: |
            apps/tianshu-desktop/release/**/*.dmg
            apps/tianshu-desktop/release/**/*.exe
            apps/tianshu-desktop/release/**/*.AppImage
            apps/tianshu-desktop/release/**/latest*.yml

  # Android APK：debug 签名起步（expo 模板 release 构型默认 signingConfig
  # debug，出 release 优化 bundle + debug 证书，可独立安装分发；正式分发
  # 再升 keystore 走 secrets）。CNG 模式：android/ 由 prebuild 每次动态
  # 生成不入库；nativewind 本地树由 postinstall 恢复（metro transform 依赖）
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ubuntu-latest 2026-11 切 Ubuntu 26.04 镜像后默认 JDK 17→25（Temurin 25），
      # Expo 57/RN 0.86 工具链（AGP 8.12 externalNativeBuild 集成）在 JDK 25 上
      # configureCMakeRelWithDebInfo 崩（JEP 472 restricted method 警告即 JVM 25
      # 佐证，JDK 17 无此机制）——钉回 RN 官方推荐的 temurin 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: npm install
      - name: Build shared packages
        run: npm run build -w packages/tianshu-core
      - name: Prebuild (CNG)
        run: npx expo prebuild -p android --no-install
        working-directory: apps/tianshu-mobile
      - name: Build APK (release 构型 + debug 签名)
        run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/tianshu-mobile/android
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tianshu-Android
          path: apps/tianshu-mobile/android/app/build/outputs/apk/release/*.apk

  # 发布面单点：全构建成功后串行收口——单次创建 Release、单处写 body、
  # 一次性挂全部资产；softprops 幂等（已存在则补传），重跑安全
  publish:
    needs: [release, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Tianshu-*
          merge-multiple: true
          path: release-assets
      - name: Create release and attach assets
        uses: softprops/action-gh-release@v2
        with:
          # 无签名分发说明（macOS「已损坏」/ Windows SmartScreen 绕行）；
          # 仅 release 创建时写入，版本要点直接维护在模板文件里
          body_path: .github/RELEASE_NOTES.md
          files: release-assets/**
          # glob 空匹配（构建产物意外缺席）时显式失败，防发空 Release
          fail_on_unmatched_files: true
