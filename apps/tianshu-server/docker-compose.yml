# apps/tianshu-server/docker-compose.yml
# 全栈部署：server（SQLite 主库挂卷持久化，缺省）+ PG 检索库（可选能力，
# 随栈提供）+ 主库 PG（可选 profile main-pg，见 README 双模式段）
# 一键：docker compose up -d（构建慢首次 ~10 分钟；data 卷持久化 SQLite 主库）
services:
  search-pg:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: tianshu
      POSTGRES_PASSWORD: tianshu_search
      POSTGRES_DB: tianshu_search
    volumes:
      - search-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tianshu -d tianshu_search"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 宿主直连调试时放开：ports: ["5432:5432"]
  # 主库 PG（双引擎 spec 2026-10-31）：仅 --profile main-pg 启用时存在——
  # 配合 server 的 TIANSHU_DB_URL=postgres://tianshu:tianshu_main@main-pg:5432/
  # tianshu_main 整体切 PG 主库（缺省不启用，SQLite 主库零变化）
  main-pg:
    profiles: ["main-pg"]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: tianshu
      POSTGRES_PASSWORD: tianshu_main
      POSTGRES_DB: tianshu_main
    volumes:
      - main-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tianshu -d tianshu_main"]
      interval: 5s
      timeout: 3s
      retries: 10
  server:
    build:
      context: ../..
      dockerfile: apps/tianshu-server/Dockerfile
    environment:
      # 缺省空串=未设（applyJwtSecretEnv 空白即 falsy）→ 服务端进程级随机秘密
      # 回退（不可伪造，JWT 登录关）；显式 export JWT_SECRET=... 方启用 JWT
      # 登录——不给仓库公开默认值，防公开密钥签出可伪造 admin JWT
      JWT_SECRET: ${JWT_SECRET:-}
      # fail-closed：未设/空串直接拒绝起栈——token.guard 将空串当未设放行全部
      # 路由（graph/session 等 @Public 面 JWT 也不兜底），不可静默无鉴权裸奔
      TIANSHU_TOKEN: ${TIANSHU_TOKEN:?TIANSHU_TOKEN required (openssl rand -hex 32)}
      # 主库落点（PrismaService 的 TIANSHU_DB_URL 覆盖机制）：缺省 SQLite
      # 落 server-data 卷；main-pg 模式（--profile main-pg）先
      # export TIANSHU_DB_URL=postgres://tianshu:tianshu_main@main-pg:5432/tianshu_main
      # 整体切 PG 主库（首启自动 migrate deploy 建表，检索层同库跟随）
      TIANSHU_DB_URL: ${TIANSHU_DB_URL:-file:/app/data/local.db}
      SEARCH_DB_URL: postgres://tianshu:tianshu_search@search-pg:5432/tianshu_search
    volumes:
      - server-data:/app/data
    depends_on:
      search-pg:
        condition: service_healthy
    # 起栈竞态兜底（终审 F2）：main-pg 走 profile 门控，不加 depends_on——
    # 缺省 SQLite 栈会被连带拉起 PG；`--profile main-pg` 同时起栈时 migrate
    # deploy 可能先于 main-pg 就绪（ECONNREFUSED），由两侧兜底：本服务 restart
    # 重启进程 + ensureDatabasePg 连接类失败有界重试（3 次×2s）
    restart: unless-stopped
    ports:
      - "3000:3000"
    # 存活探测：alpine busybox wget 打 actuator 健康端点。两处不能按直觉写：
    # ① host 用 127.0.0.1——busybox wget 解析 localhost 优先 ::1，服务只听
    #   IPv4（0.0.0.0:3000），写 localhost 每探测必 refused、永久 unhealthy；
    # ② 必须带 Bearer token——StaticTokenGuard 不感知 @Public（豁免仅
    #   webhook/、backup/ 两前缀），TIANSHU_TOKEN 部署下裸 wget 必 401；
    #   $$ 转义交由容器内 shell 从 environment 展开真实 token
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header \"Authorization: Bearer $$TIANSHU_TOKEN\" http://127.0.0.1:3000/actuator/health > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  search-pg-data: {}
  main-pg-data: {}
  server-data: {}
