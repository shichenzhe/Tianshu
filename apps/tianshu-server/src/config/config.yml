# 服务配置
app:
  # 服务配置
  port: 3000
  # 监听地址（缺省 0.0.0.0 监听所有网卡；内网部署建议指定，如 127.0.0.1）
  # hostname: '0.0.0.0'
  # 反代终止 TLS 声明（P2-1）：非 loopback 明文监听时启动告警的豁免标识——
  # 部署面由反代（nginx 等）终止 TLS 才置 true；env TIANSHU_TLS_PROXY=1 同效
  # tlsBehindProxy: false
  # 上下文路径
  contextPath: /
  # 应用名称
  name: 'tianshu-server'
  # 压缩配置
  compression:
    enabled: true
    threshold: 2048
    level: 1
    memLevel: 8

# 数据库配置
database:
  url: 'file:./local.db' # SQLite 示例

# 监控配置
management:
  # 健康检查
  health:
    diskSpace:
      enabled: true
      thresholdPercent: 0.9
    memory:
      enabled: true
      thresholdPercent: 0.95
  timeout: 5000
  # 指标配置
  metrics:
    enabled: true
    enable:
      # 启用各类指标收集
      system: true
      http: true
      process: true
      datasource: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      slo:
        http.server.requests: 10ms,50ms,100ms,200ms,500ms,1s,2s,5s
    tags:
      application: 'tianshu-server'
      service: backend
      version: 1.0.0
  # 安全配置
  security:
    enabled: false # 是否启用安全控制
    requireAuth: false # 是否需要认证
    allowedIps: # 允许访问的IP地址（支持CIDR格式）
      - '127.0.0.1'
      - '::1'
      - '192.168.1.0/24' # 示例：局域网段
    tokens: # 允许的Bearer tokens（部署时替换：openssl rand -hex 32）
      # - 'your-secret-token-here'  # 安全批 E3：样例凭证注释化
    users: # Basic认证用户（部署时自行配置——安全批 E3 样例弱口令注释化）
      # - username: 'admin'
      #   password: '<set-at-deploy>'
      #   roles: ['ACTUATOR_ADMIN']

# 接口文档
swagger:
  enabled: true
  path: /api-docs
  title: 'tianshu-server API'
  description: 'tianshu-server API Documentation'
  version: 1.0.0

# 响应配置
response:
  # 不需要统一响应包装的接口路径
  excludePaths:
    - /actuator/health
    # SSE 事件流（GET /event）由 reply.raw 直写，不可统一包装（T7）
    - /event
    - /actuator/metrics
    - /actuator/metrics/config
    - /actuator/metrics/reset
    # CRL 名单直出 {epoch, revokedAk, revokedTenant}（relay 侧 crl.ts
    # parseList 读顶层双数组——统一包装会破坏 Task 6/12 契约）
    - /relay-admin/revocations

# 日志配置
log:
  level: info
  dir: ./logs
  maxSize: 50MB
  maxFiles: 10
  maxDays: 7
  datePattern: YYYY-MM-DD
  format: YYYY-MM-DD HH:mm:ss,SSS
  pattern: '%d [%t] [%trace_id] %-5p %c - %m%n'

# 操作日志配置（security.md §6 P0-2：谁改了什么的审计面——脚手架期
# DISABLE_LOG 写死停用已改配置驱动；details 脱敏口径对齐桌面审计链
# commandPreview，IP/UA 落表列）
operationLog:
  # 是否启用（false 时拦截器直通不落表；缺省 true）
  enabled: true

# 认证配置
auth:
  global: true
  defaultStrategy: jwt
  jwt:
    # 签名密钥已外移 .env 的 JWT_SECRET（spec §13 项 6，不入库）：
    # npm run init 自动生成随机值写入，或手工 `openssl rand -hex 32`；
    # 未配置时启动告警且 JWT 登录不可用（天枢远控面走 TIANSHU_TOKEN 不受影响）
    expiresIn: '30m'
    refreshExpiresIn: '12h'

  basic:
    users: # 安全批 E3：样例弱口令注释化——defaultStrategy=jwt 时不生效，启用 basic 前必须自行配置
      # - username: '<set-at-deploy>'
      #   password: '<set-at-deploy>'
      #   roles: ['user']
  oauth2:

# 天枢桌面端联动配置
tianshu:
  # 数据根目录（与桌面端 ~/.tianshu 隔离）
  dataRoot: ~/.tianshu-server
  chat:
    # 是否允许危险工具
    allowDangerousTools: false
    # 删除保护：true=delete_file 移入回收目录；false=永久删除（T6 复审 M3）
    deleteProtection: true
    # 工具审批模式（T7 裁定）：default=需审批操作自动拒绝（无应答方不挂起）；
    # auto-approve=静默放行（等价 mirror 会话 full 模式）
    accessMode: default
  # 是否启用与桌面端的握手
  handshake: true

  # 图编排 HTTP 节点守卫策略（逃生口 2026-11-04；缺省严拦=安全审查
  # S5/F1 语义；协议/metadata/链路本地为硬边界不可豁免）
  graph:
    # 整体放开内网访问（环回/私网/CGNAT + 域名解析到内网；内网部署可一键）
    allowPrivateNetwork: false
    # 显式放行清单：精确 IP / 精确域名 / IPv4 CIDR
    # allowlist:
    #   - '127.0.0.1'
    #   - 'jira6.app.hd123.cn'
    #   - '192.168.1.0/24'

# relay-admin 控制平面配置（多租户批 spec 2026-11-03 §6/§9；仅 relay-admin
# 独立入口消费，主应用忽略本段）。env RA_RELAY_BASE_URL / RA_INTERNAL_SECRET
# 优先于本段（JWT_SECRET 同款纪律）
relayAdmin:
  # relay 本体地址（Task 13 kick/stats 联动消费；缺省指向本机缺省端口）
  relayBaseUrl: 'http://127.0.0.1:8410'
  # internal secret 已外移 .env 的 RA_INTERNAL_SECRET（不入 config.yml——
  # 与 relay 本体 --internal-secret 是同一秘密的两半，运营方双机各持）：
  # 未配置时 /relay-admin/revocations fail-closed 503
  # internalSecret: '<set-at-deploy: openssl rand -hex 32>'
